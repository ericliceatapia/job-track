[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "jobtrack"
version = "0.1.0"
description = "A local CLI job application tracker."
requires-python = ">=3.14"
dependencies = [
    "sqlalchemy>=2.0",
    "typer",
]

[project.scripts]
jt = "jobtrack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
